<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统授权 · DSH</title>
<style>
:root{color-scheme:light}*{box-sizing:border-box}body{font:15px/1.6 system-ui,sans-serif;color:#17304a;background:#f5f7fb;max-width:1000px;margin:0 auto;padding:28px 20px}h1{margin:0}h2{font-size:19px;margin:0 0 14px}p{margin:10px 0}a{color:#205dc5}.card{background:white;border:1px solid #d9e1ed;border-radius:12px;padding:22px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}label{display:grid;gap:6px;font-weight:600}input,select,textarea,button{font:inherit;color:#17304a;background:white;border:1px solid #b8c6d9;border-radius:7px;padding:10px;min-width:0}input,select,textarea{width:100%}textarea{resize:vertical;min-height:120px;font-family:ui-monospace,monospace}button{cursor:pointer}button.primary{background:#225cc6;color:white;border-color:#225cc6}button:disabled{color:#566477;background:#e8edf4;cursor:not-allowed}input:read-only{background:#f3f6fb}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.hint{color:#54657b;font-size:13px}#status,#feedback{padding:10px 12px;background:#edf3fc;border-radius:6px;overflow-wrap:anywhere}#feedback:empty{display:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto}summary{cursor:pointer}details{margin:14px 0}:focus-visible{outline:2px solid #2362cf;outline-offset:2px}@media(max-width:640px){.grid{grid-template-columns:1fr}body{padding:18px 12px}.card{padding:16px}}
</style>
<h1>系统授权</h1><p>使用各系统自己的账号登录，由目标系统校验角色权限。先在 <a href="/vault">Vault</a> 解锁保险箱。</p>
<section class="card"><h2>选择接入系统</h2><div class="grid"><label for="system">系统<select id="system"></select></label><label for="url">平台网址<input id="url" type="url" readonly></label></div><p class="hint">网址对应宿主已配置的共享核心。选择系统会切换独立授权，不会自动授权其他系统。</p><p id="status" role="status">正在读取系统配置…</p>
<form id="login" novalidate><div class="grid"><label for="username">用户名<input id="username" autocomplete="username" placeholder="目标系统用户名"></label><label for="password">密码<input id="password" type="password" autocomplete="current-password"></label></div><div class="actions"><button class="primary" type="submit">登录</button><button id="refresh" type="button">刷新状态</button><button id="logout" type="button">注销当前系统</button></div></form>
<details><summary>登录 JSON 输入</summary><p class="hint">生成或粘贴包含 systemId、url、username、password 的 JSON。密码仅用于此人工登录表单，提交后清空；请勿粘贴到聊天记录。</p><button id="generate" type="button">生成登录 JSON</button><label for="loginJson">登录 JSON<textarea id="loginJson" autocomplete="off" spellcheck="false"></textarea></label><button id="jsonLogin" type="button">使用 JSON 登录</button></details>
<p id="feedback" role="status" aria-live="polite"></p></section>
<section class="card"><h2>命令与权限校验</h2><form id="execute"><div class="grid"><label for="command">命令<select id="command"></select></label><label id="projectLabel" for="project">项目 ID（Data Platform，可选）<input id="project" type="number" min="1"></label></div><p class="hint">Forge 项目编号放入 JSON 的 project 字段；命令输入中不得包含密码或 Token。权限不足会由目标系统明确拒绝。</p><label for="input">命令 JSON<textarea id="input" spellcheck="false">{}</textarea></label><label for="userPassword">创建 / 修改用户的密码（仅人工操作时填写）<input id="userPassword" type="password" autocomplete="new-password"></label><div class="actions"><button class="primary">执行命令</button></div></form><pre id="result" aria-live="polite"></pre></section>
<script>
const $=id=>document.getElementById(id);let providers=[],busy=false,serial=0;
const messages={VAULT_LOCKED:'保险箱已锁定，请先打开 Vault 解锁。',DP_UNAUTHORIZED:'登录或会话校验失败，请确认用户名、密码及账号启用状态。',DP_LOGIN_REQUIRED:'尚未登录，请先登录当前系统。',DP_PERMISSION_DENIED:'权限不足，目标系统拒绝了此操作。',DP_VERSION_CONFLICT:'配置版本冲突，请重新读取后再操作。',DP_UNAVAILABLE:'目标系统暂不可用，请检查服务配置。',SYSTEM_TARGET_MISMATCH:'网址与所选系统不匹配，请使用已配置的网址。',SYSTEM_NOT_FOUND:'系统未配置，请刷新后选择。',DP_INVALID_INPUT:'输入不合法，请检查字段与 JSON。'};
const current=()=>providers.find(p=>p.id===$('system').value);
function describe(value){return messages[value?.error]|| (value?.error?'操作失败：'+value.error:'操作完成。');}
async function call(action,data){const r=await fetch('/systems/'+action,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data),signal:AbortSignal.timeout(30000)});return await r.json();}
function lock(value){busy=value;for(const el of document.querySelectorAll('button,#system'))el.disabled=value;}
function failure(e){return e.name==='TimeoutError'?'请求超时，结果尚未确认。请刷新状态后再操作。':'连接失败，请确认 DSH 服务正在运行。';}
async function refresh(){const p=current();if(!p)return;const seq=++serial;try{const v=await call('status',{systemId:p.id});if(seq!==serial)return;$('status').textContent=v.error?describe(v):v.authorized?`已登录 ${p.label} · ${v.user?.username||v.user?.displayName||'已授权账号'}`:`尚未登录 ${p.label}`;}catch(e){if(seq===serial)$('status').textContent=failure(e);}}
function choose(){serial++;const p=current();$('url').value=p?.url||'';$('command').replaceChildren();for(const c of p?.commands||[]){const o=document.createElement('option');o.value=c;o.textContent=c;$('command').append(o);}for(const id of ['username','password','loginJson','userPassword','project'])$(id).value='';$('input').value='{}';$('feedback').textContent='';$('result').textContent='';$('projectLabel').hidden=p?.id!=='dataplatform';refresh();}
function loginData(){return {systemId:$('system').value,url:$('url').value,username:$('username').value.trim(),password:$('password').value};}
function validate(data){const p=current();if(!p||!data||data.systemId!==p.id||data.url!==p.url)throw Error('JSON 的 systemId 和 url 必须与当前所选系统一致。');if(typeof data.username!=='string'||!data.username.trim()||typeof data.password!=='string'||!data.password)throw Error('请填写用户名和密码。');if(Object.keys(data).some(k=>!['systemId','url','username','password'].includes(k)))throw Error('登录 JSON 仅支持 systemId、url、username、password。');return data;}
async function login(data){if(busy)return;try{validate(data);}catch(e){$('feedback').textContent=e.message;return;}lock(true);$('password').value='';$('loginJson').value='';$('feedback').textContent='正在登录…';try{const v=await call('login',data);$('feedback').textContent=v.status==='authorized'?'登录成功。':describe(v);await refresh();}catch(e){$('feedback').textContent=failure(e);}finally{data.password='';lock(false);}}
$('login').onsubmit=e=>{e.preventDefault();login(loginData());};$('generate').onclick=()=>{try{$('loginJson').value=JSON.stringify(validate(loginData()),null,2);$('feedback').textContent='已生成登录 JSON。';}catch(e){$('feedback').textContent=e.message;}};
$('jsonLogin').onclick=()=>{try{const data=JSON.parse($('loginJson').value);login(data);}catch{$('feedback').textContent='登录 JSON 格式错误。';}};
$('system').onchange=choose;$('refresh').onclick=refresh;$('logout').onclick=async()=>{if(busy||!current())return;lock(true);try{const v=await call('logout',{systemId:current().id});$('feedback').textContent=v.error?describe(v):'已注销当前系统。';await refresh();}catch(e){$('feedback').textContent=failure(e);}finally{lock(false);}};
$('execute').onsubmit=async e=>{e.preventDefault();if(busy||!current())return;let data;try{data={systemId:current().id,command:$('command').value,input:JSON.parse($('input').value),userPassword:$('userPassword').value,...(!$('projectLabel').hidden&&$('project').value?{projectId:Number($('project').value)}:{})};}catch{$('feedback').textContent='命令 JSON 格式错误。';return;}lock(true);$('userPassword').value='';$('feedback').textContent='正在执行…';try{const v=await call('execute',data);$('result').textContent=JSON.stringify(v,null,2);$('feedback').textContent=describe(v);}catch(e){$('feedback').textContent=failure(e);}finally{data.userPassword='';lock(false);}};
(async()=>{try{const r=await fetch('/systems/providers',{signal:AbortSignal.timeout(15000)});providers=await r.json();if(!Array.isArray(providers))throw Error();for(const p of providers){const o=document.createElement('option');o.value=p.id;o.textContent=p.label;$('system').append(o);}if(providers.length)choose();else $('status').textContent='尚未配置接入系统。';}catch{$('status').textContent='系统配置加载失败，请刷新重试。';}})();
</script></html>
