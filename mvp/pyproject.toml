[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-workbench-mvp"
version = "0.1.0"
description = "Phase 0 validation probes for the Hermes local agent workbench"
requires-python = ">=3.11,<3.14"
dependencies = [
  "cryptography>=44,<47",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "openai-agents @ git+https://github.com/johnasonsu-bot/openai-agents-python.git@e773b15488c491d907d42756d91e470f280a3d7e",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.55,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/workbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
markers = [
  "development_graph_meta_e2e: runs full external backend and Electron suites only on the happy path",
]
